server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # nome do servico com prefixo: o container tambem fica na rede easypanel,
  # onde um "api" generico poderia apontar para outro projeto
  location /api/ {
    proxy_pass http://cidadenobre-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store";
  }

  # JS e CSS levam hash no nome, podem ficar em cache para sempre
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # /gestao e /indique/CODIGO sao rotas do front
  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri /index.html;
  }
}
